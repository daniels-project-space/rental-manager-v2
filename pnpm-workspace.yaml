# pnpm 11 build-script approvals. This pnpm uses the allowBuilds map (boolean values).
# These deps legitimately need their postinstall build scripts (native binaries, etc.).
allowBuilds:
  '@depot/cli': true
  '@google/genai': true
  bufferutil: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
