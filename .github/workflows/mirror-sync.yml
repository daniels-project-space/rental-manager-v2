name: mirror-sync

# Wave 4 — fail any PR that lets `convex/mv/constants.ts` drift away from
# `src/mastra/data/constants.ts`. The two MUST mirror each other for the
# Mastra and Convex layers to compute the same numbers (revenue / lost
# revenue / fee math). See scripts/check-mirror-sync.mjs.

on:
  pull_request:
    paths:
      - "src/mastra/data/constants.ts"
      - "convex/mv/constants.ts"
      - "scripts/check-mirror-sync.mjs"
      - ".github/workflows/mirror-sync.yml"
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run check:mirror
